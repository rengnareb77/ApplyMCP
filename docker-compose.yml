services:
  backend:
    image: registry.lucas-beranger.fr/applymcp/api-spring:latest
    container_name: applymcp-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/applymcp?authSource=admin
    depends_on:
      - mongo

  frontend:
    image: registry.lucas-beranger.fr/applymcp/frontend-react:latest
    container_name: applymcp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"

  mongo:
    image: mongo:4.4
    container_name: applymcp-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - applymcp-mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

volumes:
  applymcp-mongo-data:
