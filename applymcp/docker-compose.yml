version: '3.8'

services:
  app:
    build:
      context: .
      args:
        - VITE_GRAPHQL_ENDPOINT_ARG=${VITE_GRAPHQL_ENDPOINT}
    image: applymcp
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_HOST=${MONGO_HOST}
      - SPRING_DATA_MONGODB_PORT=${MONGO_PORT}
      - SPRING_DATA_MONGODB_DATABASE=${MONGO_DATABASE}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  mongo-data: {}
