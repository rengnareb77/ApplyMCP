version: '3.8'

services:
  backend:
    build:
      context: .
    image: applymcp-backend
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_HOST=${MONGO_HOST:-mongo}
      - SPRING_DATA_MONGODB_PORT=${MONGO_PORT:-27017}
      - SPRING_DATA_MONGODB_DATABASE=${MONGO_DATABASE:-applymcp}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GRAPHQL_ENDPOINT_ARG=${VITE_GRAPHQL_ENDPOINT:-http://localhost:8080/graphql}
    image: applymcp-frontend
    platform: linux/amd64
    ports:
      - "3000:80"
    depends_on:
      - backend

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  mongo-data: {}
