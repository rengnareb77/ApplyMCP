spring.application.name=applymcp
spring.graphql.graphiql.enabled=true
spring.mongodb.uri=mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:admin}@mongo:27017/applymcp?authSource=admin
spring.ai.mcp.server.name=applymcp-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

# Définit le préfixe pour toutes les routes du backend
server.servlet.context-path=/api
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp